<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Affiliate</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--g:#059669;--d:#0f172a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f1f5f9;color:var(--d);font-size:14px}
input,select,button,textarea{padding:9px 11px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;width:100%;margin:4px 0}
button{width:auto;margin:2px;background:var(--g);color:#fff;border:0;font-weight:600;cursor:pointer}
button.gr{background:#e2e8f0;color:var(--d)} button.rd{background:#dc2626}
.auth{max-width:380px;margin:7vh auto;background:#fff;padding:26px;border-radius:14px;box-shadow:0 2px 14px #0002}
.auth button{width:100%;margin:8px 0 2px}
.lk{background:none;color:var(--g);width:auto;padding:4px;text-decoration:underline}
#app{display:none}
aside{width:240px;background:var(--d);color:#cbd5e1;position:fixed;top:0;bottom:0;left:0;padding:16px 10px;display:flex;flex-direction:column;z-index:20;transition:.2s}
aside h3{color:#fff;margin:4px 8px}
.sm{font-size:12px;color:#94a3b8;margin:0 8px 14px;word-break:break-all}
.nv{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;color:#cbd5e1;padding:10px 12px;margin:2px 0}
.nv:hover{background:#1e293b}.nv.on{background:var(--g);color:#fff}
.bd{background:#fbbf24;color:var(--d);border-radius:99px;padding:0 7px;font-size:11px}
main{margin-left:240px;padding:24px}
.hb{display:none;width:auto}
.card{background:#fff;border-radius:12px;padding:16px;margin:0 0 16px;box-shadow:0 1px 6px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.grid .card{margin:0}.grid b{font-size:20px;display:block;margin-top:4px}
.fr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.fr input,.fr select{flex:1;min-width:120px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid #e2e8f0;white-space:nowrap}
td input,td select{margin:0;min-width:80px}
.st{background:#e2e8f0;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.kpi span{color:#64748b;font-size:12px}.kpi small{display:block;font-size:12px;margin-top:2px}.up{color:#059669}.dn{color:#dc2626}.nt{color:#94a3b8}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}.cols .card{margin:0}.cv{position:relative;margin-top:10px}
.chip{background:#fff;color:#0f172a;border:1px solid #cbd5e1}.chip.on{background:#0f172a;color:#fff;border-color:#0f172a}
.insight{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;padding:12px 16px;border-radius:10px;margin-bottom:16px;line-height:1.5}
.ord .oh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.og{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.og small{display:block;color:#64748b;font-size:11px;letter-spacing:.05em;margin-bottom:3px}.og a{display:block;color:#059669}.og b{display:block}
.oa{margin-top:12px;padding-top:12px;border-top:1px dashed #e2e8f0}.oa select,.oa input{width:auto;flex:0 1 190px;margin:0}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
@media(max-width:800px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0;padding:14px}.hb{display:inline-block}}
</style>
</head>
<body>

<div id="auth" class="auth">
  <h2 style="margin-top:0">Portal Affiliate</h2>
  <div id="f-l">
    <input id="le" type="email" placeholder="Emel">
    <input id="lp" type="password" placeholder="Kata laluan">
    <button onclick="login()">Log masuk</button>
    <button class="lk" onclick="showAuth('r')">Belum ada akaun? Daftar sebagai affiliate</button>
  </div>
  <div id="f-r" style="display:none">
    <input id="rn" placeholder="Nama penuh">
    <input id="rt" placeholder="No. telefon">
    <input id="re" type="email" placeholder="Emel">
    <input id="rp" type="password" placeholder="Kata laluan (min 6 aksara)">
    <button onclick="register()">Daftar</button>
    <button class="lk" onclick="showAuth('l')">Sudah ada akaun? Log masuk</button>
  </div>
</div>

<div id="app">
  <aside id="sb">
    <h3>Portal Affiliate</h3>
    <div id="who" class="sm"></div>
    <nav id="nav"></nav>
    <div style="margin-top:auto"><button class="nv" onclick="logout()">Log keluar</button></div>
  </aside>
  <main>
    <div class="fr" style="margin-bottom:16px">
      <button class="hb gr" onclick="document.getElementById('sb').classList.toggle('open')">&#9776;</button>
      <h2 id="title" style="margin:0"></h2>
    </div>
    <div id="content"></div>
  </main>
</div>

<script>
const db = supabase.createClient('https://hdqzankwjhhvywabjxtm.supabase.co', 'sb_publishable_FEGHw6qemE6cj77TmnDMVA_k7gU5J2S');
// Alamat kedai = folder yang sama dengan portal ini (index.html)
const STORE_URL = location.origin + location.pathname.replace(/[^/]*$/, '');

const $ = id => document.getElementById(id);
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm = n => 'RM ' + Number(n || 0).toFixed(2);
const st = s => `<span class="st">${e(s)}</span>`;
const card = (l, v) => `<div class="card">${l}<b>${v}</b></div>`;
const table = (h, r) => `<div class="card tw"><table><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr>${r.map(row => `<tr>${row.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>${r.length ? '' : '<p>Tiada rekod.</p>'}</div>`;
const sum = (a, s) => a.filter(x => x.status === s).reduce((t, x) => t + Number(x.amount), 0);
const run = async (p, msg) => { const { error } = await p; if (error) alert(error.message); else if (msg) alert(msg); render(); };

const NAV = {
  admin: [['ovw','Overview'],['aff','Affiliates'],['prod','Produk & Komisen'],['ord','Orders'],['pay','Payout'],['set','Tetapan']],
  affiliate: [['dash','Dashboard'],['com','Komisen & Payout'],['prof','Profil & Bank']]
};
const ORDER_STATUS = ['PENDING_PAYMENT','PAID','SHIPPED','COMPLETED','CANCELLED','REFUNDED'];
let me = null, aff = null, tab = '', cnt = {}, prodCache = [], ordFilter = 'PAID', ordQ = '', ordCache = [], ordList = [], ovwDays = 30, charts = [], after = null;

// ---------- AUTH ----------
function showAuth(k) { $('f-l').style.display = k === 'l' ? 'block' : 'none'; $('f-r').style.display = k === 'r' ? 'block' : 'none'; }
async function login() {
  const { error } = await db.auth.signInWithPassword({ email: $('le').value.trim(), password: $('lp').value });
  if (error) return alert(error.message);
  boot();
}
async function register() {
  const { error } = await db.auth.signUp({
    email: $('re').value.trim(), password: $('rp').value,
    options: { data: { full_name: $('rn').value.trim(), phone: $('rt').value.trim() } }
  });
  if (error) return alert(error.message);
  alert('Pendaftaran berjaya. Semak emel untuk pengesahan (jika diminta), kemudian log masuk. Akaun perlu diluluskan admin dahulu.');
  showAuth('l');
}
async function logout() { await db.auth.signOut(); location.reload(); }

async function boot() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return showAuth('l');
  const { data: p } = await db.from('profiles').select('*').eq('id', session.user.id).single();
  me = p;
  if (p.role === 'affiliate') { const { data: a } = await db.from('affiliates').select('*').eq('user_id', p.id).single(); aff = a; }
  $('auth').style.display = 'none'; $('app').style.display = 'block';
  tab = NAV[me.role][0][0];
  render();
}

// ---------- SHELL ----------
const go = k => { tab = k; render(); };
async function render() {
  if (me.role === 'admin') {
    const [a, b, d] = await Promise.all([
      db.from('affiliates').select('id', { count: 'exact', head: true }).eq('status', 'PENDING_APPROVAL'),
      db.from('payouts').select('id', { count: 'exact', head: true }).eq('status', 'REQUESTED'),
      db.from('orders').select('id', { count: 'exact', head: true }).eq('status', 'PAID')
    ]);
    cnt = { aff: a.count, pay: b.count, ord: d.count };
  } else {
    const { data: a } = await db.from('affiliates').select('*').eq('user_id', me.id).single(); aff = a;
  }
  $('nav').innerHTML = NAV[me.role].map(([k, l]) => `<button class="nv ${k === tab ? 'on' : ''}" onclick="go('${k}')"><span>${l}</span>${cnt[k] ? `<b class="bd">${cnt[k]}</b>` : ''}</button>`).join('');
  $('who').textContent = (me.full_name || me.email) + ' (' + me.role + ')';
  $('title').textContent = NAV[me.role].find(x => x[0] === tab)[1];
  $('sb').classList.remove('open');
  after = null;
  try { $('content').innerHTML = await VIEWS[tab](); }
  catch (err) { console.error(err); $('content').innerHTML = `<div class="card"><b>Ralat memuatkan halaman</b><p>${e(err.message)}</p></div>`; }
  if (after) { try { after(); } catch (err) { console.error(err); } after = null; }
}

// ---------- PAPARAN ----------
const VIEWS = {
  // ADMIN
  ovw: async () => {
    const days = ovwDays, DAY = 864e5, now = Date.now();
    const since = new Date(now - (days * 2 + 2) * DAY).toISOString();
    const [o, it, c, a, pd] = await Promise.all([
      db.from('orders').select('id,status,subtotal,affiliate_id,created_at').gte('created_at', since),
      db.from('order_items').select('product_name,qty,unit_price,products(type),orders(status,created_at)'),
      db.from('commissions').select('amount,status'),
      db.from('affiliates').select('id,name,code,status,clicks'),
      db.from('orders').select('id', { count: 'exact', head: true }).eq('status', 'PAID')
    ]);
    const isPaid = s => ['PAID', 'SHIPPED', 'COMPLETED'].includes(s);
    const day = d => new Date(d).toLocaleDateString('en-CA');
    const keysOf = (n, off) => [...Array(n)].map((_, i) => day(now - (off + n - 1 - i) * DAY));
    const keys = keysOf(days, 0), prevKeys = keysOf(days, days);
    const P = (o.data || []).filter(x => isPaid(x.status));
    const sBy = {}, nBy = {};
    P.forEach(x => { const k = day(x.created_at); sBy[k] = (sBy[k] || 0) + Number(x.subtotal); nBy[k] = (nBy[k] || 0) + 1; });
    const tot = (ks, m) => ks.reduce((t, k) => t + (m[k] || 0), 0);
    const cur = keys.map(k => sBy[k] || 0), ords = keys.map(k => nBy[k] || 0);
    const sales = tot(keys, sBy), orders = tot(keys, nBy), pSales = tot(prevKeys, sBy), pOrders = tot(prevKeys, nBy);
    const delta = (x, y) => y > 0 ? (x - y) / y * 100 : null;
    const dBadge = d => d === null ? '<small class="nt">tiada data tempoh sebelum ini</small>' : `<small class="${d >= 0 ? 'up' : 'dn'}">${d >= 0 ? '&#9650;' : '&#9660;'} ${Math.abs(d).toFixed(0)}% berbanding ${days} hari sebelumnya</small>`;
    const kpi = (l, v, x) => `<div class="card kpi"><span>${l}</span><b>${v}</b>${x || ''}</div>`;
    const cm = st => (c.data || []).filter(x => x.status === st).reduce((t, x) => t + Number(x.amount), 0);

    const inP = (it.data || []).filter(x => x.orders && isPaid(x.orders.status) && keys.includes(day(x.orders.created_at)));
    const byType = {}, byProd = {};
    inP.forEach(x => { const v = x.qty * Number(x.unit_price), t = x.products?.type || 'LAIN'; byType[t] = (byType[t] || 0) + v; const r = byProd[x.product_name] ||= { q: 0, v: 0 }; r.q += x.qty; r.v += v; });
    const TN = { BOOK: 'Buku', WEBINAR: 'Webinar', EVENT: 'Event', LAIN: 'Lain-lain' };
    const topP = Object.entries(byProd).sort((x, y) => y[1].v - x[1].v).slice(0, 5);

    const affMap = {};
    P.filter(x => x.affiliate_id && keys.includes(day(x.created_at))).forEach(x => { const r = affMap[x.affiliate_id] ||= { n: 0, v: 0 }; r.n++; r.v += Number(x.subtotal); });
    const topA = Object.entries(affMap).sort((x, y) => y[1].v - x[1].v).slice(0, 5).map(([id, r]) => {
      const f = (a.data || []).find(z => z.id === id) || {};
      return [e(f.name), e(f.code), rm(r.v), r.n, f.clicks || 0, f.clicks ? (r.n / f.clicks * 100).toFixed(1) + '%' : '-'];
    });

    const fmtD = k => new Date(k + 'T00:00:00').toLocaleDateString('ms-MY', { day: 'numeric', month: 'short' });
    const bi = cur.indexOf(Math.max(...cur));
    const insight = orders
      ? `Dalam ${days} hari terakhir: <b>${rm(sales)}</b> daripada <b>${orders} order</b>. Hari terbaik: <b>${fmtD(keys[bi])}</b> (${rm(cur[bi])}).${topP[0] ? ` Produk terlaris: <b>${e(topP[0][0])}</b>.` : ''}`
      : `Belum ada jualan dalam ${days} hari terakhir. Bila order pertama dibayar, carta akan muncul di sini.`;
    const todo = [[pd.count, 'order dibayar, menunggu dihantar/diselesaikan', 'ord'], [cnt.aff, 'affiliate menunggu kelulusan', 'aff'], [cnt.pay, 'permohonan payout menunggu dibayar', 'pay']].filter(x => x[0] > 0);

    after = () => {
      charts.forEach(ch => ch.destroy()); charts = [];
      if (typeof Chart === 'undefined' || !orders) return;
      Chart.defaults.font.family = 'system-ui,sans-serif'; Chart.defaults.color = '#64748b';
      const mk = (id, cfg) => { const el = $(id); if (el) charts.push(new Chart(el, cfg)); };
      const money = v => 'RM ' + Number(v).toLocaleString('ms-MY', { maximumFractionDigits: 0 });
      mk('ch_trend', { type: 'line', data: { labels: keys.map(fmtD), datasets: [{ label: 'Jualan', data: cur, borderColor: '#059669', backgroundColor: 'rgba(5,150,105,.14)', fill: true, tension: .35, borderWidth: 2.5, pointRadius: days <= 30 ? 3 : 0, pointHoverRadius: 6, pointBackgroundColor: '#059669' }] },
        options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: x => ` ${rm(x.parsed.y)} · ${ords[x.dataIndex]} order` } } }, scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { beginAtZero: true, grace: '10%', ticks: { callback: money }, grid: { color: '#eef2f7' } } } } });
      const tk = Object.keys(byType);
      mk('ch_type', { type: 'doughnut', data: { labels: tk.map(k => TN[k]), datasets: [{ data: tk.map(k => byType[k]), backgroundColor: ['#0f172a', '#059669', '#c9a24a', '#94a3b8'], borderWidth: 2, borderColor: '#fff' }] },
        options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: x => ` ${x.label}: ${rm(x.parsed)}` } } } } });
      mk('ch_prod', { type: 'bar', data: { labels: topP.map(x => x[0]), datasets: [{ data: topP.map(x => x[1].v), backgroundColor: '#059669', borderRadius: 6, barThickness: 22 }] },
        options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: x => ` ${rm(x.parsed.x)} · ${topP[x.dataIndex][1].q} unit` } } }, scales: { x: { ticks: { callback: money }, grid: { color: '#eef2f7' } }, y: { grid: { display: false } } } } });
    };

    return `<div class="fr" style="margin-bottom:14px">${[7, 30, 90].map(d => `<button class="chip ${d === days ? 'on' : ''}" onclick="ovwDays=${d};render()">${d} hari</button>`).join('')}</div>
    <div class="insight">${insight}</div>
    <div class="grid">${kpi('Jualan produk', rm(sales), dBadge(delta(sales, pSales)))}${kpi('Bilangan order', orders, dBadge(delta(orders, pOrders)))}${kpi('Purata nilai order', orders ? rm(sales / orders) : '-')}${kpi('Komisen perlu dibayar', rm(cm('APPROVED') + cm('REQUESTED')), '<small class="nt">kepada affiliate</small>')}${kpi('Komisen menunggu holding', rm(cm('PENDING')))}${kpi('Affiliate aktif', (a.data || []).filter(x => x.status === 'ACTIVE').length)}</div>
    <div class="card"><b>Tindakan perlu</b><div style="margin-top:8px">${todo.length ? todo.map(x => `<button class="gr" onclick="go('${x[2]}')"><b>${x[0]}</b> ${x[1]}</button>`).join('') : 'Tiada tindakan tertunda.'}</div></div>
    ${orders ? `<div class="cols"><div class="card"><b>Jualan harian</b> <small class="nt">(tanpa caj pos)</small><div class="cv" style="height:280px"><canvas id="ch_trend"></canvas></div></div><div class="card"><b>Jualan ikut jenis</b><div class="cv" style="height:280px"><canvas id="ch_type"></canvas></div></div></div>
    <div class="card"><b>Produk terlaris</b><div class="cv" style="height:${50 + topP.length * 44}px"><canvas id="ch_prod"></canvas></div></div>` : ''}
    <h3>Affiliate terbaik</h3>${table(['Nama', 'Kod', 'Jualan', 'Order', 'Klik', 'Klik kepada order'], topA)}
    <small>Jualan dikira untuk order berstatus PAID, SHIPPED atau COMPLETED.</small>`;
  },
  aff: async () => {
    const { data } = await db.from('affiliates').select('*').order('created_at', { ascending: false });
    return table(['Kod','Nama','Emel','Telefon','Status','Tier','Klik',''], data.map(a => [
      e(a.code), e(a.name), e(a.email), e(a.phone), st(a.status), e(a.tier), a.clicks,
      `<button onclick="setAff('${a.id}','ACTIVE')">Lulus</button><button class="rd" onclick="setAff('${a.id}','REJECTED')">Tolak</button><button class="gr" onclick="setAff('${a.id}','SUSPENDED')">Gantung</button>`
    ]));
  },
  prod: async () => {
    const { data } = await db.from('products').select('*').order('created_at');
    prodCache = data;
    return `<div class="card"><b>Tambah produk</b><div class="fr"><input id="np_n" placeholder="Nama produk"><select id="np_t"><option>BOOK</option><option>WEBINAR</option><option>EVENT</option></select><input id="np_p" type="number" step="0.01" placeholder="Harga (RM)"><button onclick="addProd()">Tambah</button></div></div>` +
      table(['Nama','Jenis','Harga (RM)','Jenis komisen','Nilai','Aktif',''], data.map(p => [
        e(p.name) + (p.active ? '' : ' <small>(tidak aktif)</small>'), p.type,
        `<input id="pp_${p.id}" type="number" step="0.01" value="${p.price}">`,
        `<select id="pt_${p.id}">${['DEFAULT','PERCENT','FIXED'].map(o => `<option ${o === p.commission_type ? 'selected' : ''}>${o}</option>`).join('')}</select>`,
        `<input id="pv_${p.id}" type="number" step="0.01" value="${p.commission_value}">`,
        `<input id="pa_${p.id}" type="checkbox" style="width:auto" ${p.active ? 'checked' : ''}>`,
        `<button onclick="saveProd('${p.id}')">Simpan</button><button class="rd" onclick="delProd('${p.id}')">Padam</button>`
      ])) + '<p>PERCENT = peratus daripada harga. FIXED = jumlah tetap (RM). DEFAULT = ikut kadar tier affiliate.</p><h3>Butiran paparan kedai</h3>' +
      data.map(p => `<div class="card"><b>${e(p.name)}</b><textarea id="pd_${p.id}" rows="3" placeholder="Keterangan produk">${e(p.description || '')}</textarea><input id="pi_${p.id}" placeholder="Info ringkas (cth: Webinar dalam talian · 15 Nov 2026, 8.30 malam)" value="${e(p.info || '')}"><input id="pg_${p.id}" placeholder="Pautan gambar (cth: images/buku1.jpg)" value="${e(p.image_url || '')}"><button onclick="saveInfo('${p.id}')">Simpan butiran</button></div>`).join('');
  },
  ord: async () => {
    const { data, error } = await db.from('orders').select('*, affiliates(code), order_items(product_name,qty)').order('created_at', { ascending: false });
    if (error) return `<div class="card">Ralat: ${e(error.message)}</div>`;
    ordCache = data;
    const chips = Object.entries(ORD_GROUPS).map(([k, g]) => `<button class="chip ${k === ordFilter ? 'on' : ''}" onclick="ordFilter='${k}';render()">${g[0]} (${data.filter(g[1]).length})</button>`).join('');
    return `<div class="fr" style="margin-bottom:12px">${chips}</div>
      <div class="fr" style="margin-bottom:14px"><input placeholder="Cari no. order, nama, telefon atau emel" value="${e(ordQ)}" oninput="ordQ=this.value;renderOrdList()"><button class="gr" onclick="exportOrders()">Eksport CSV (senarai ini)</button></div>
      <div id="ordlist">${ordListHtml()}</div>`;
  },
  pay: async () => {
    const { data } = await db.from('payouts').select('*, affiliates(name,code,bank_name,bank_account,bank_holder)').order('requested_at', { ascending: false });
    return table(['Affiliate','Jumlah','Akaun bank','Status','Rujukan',''], data.map(p => [
      e(p.affiliates.name) + ' (' + e(p.affiliates.code) + ')', rm(p.amount),
      e(`${p.affiliates.bank_name || ''} ${p.affiliates.bank_account || ''} a/n ${p.affiliates.bank_holder || ''}`),
      st(p.status), e(p.reference || ''),
      p.status === 'REQUESTED' ? `<button onclick="payDone('${p.id}')">Tanda Dibayar</button><button class="rd" onclick="payRej('${p.id}')">Tolak</button>` : ''
    ]));
  },
  set: async () => {
    const { data } = await db.from('settings').select('*').order('key');
    return '<div class="card">' + data.map(s => `<div class="fr"><label style="min-width:200px"><b>${e(s.key)}</b><br><small>${e(s.note)}</small></label><input id="s_${s.key}" value="${e(s.value)}"><button onclick="saveSet('${s.key}')">Simpan</button></div>`).join('') +
      `</div><div class="card"><b>Lulus komisen yang tamat tempoh holding</b><p>Tukar komisen PENDING yang tempoh holdingnya sudah tamat kepada APPROVED. Jalankan sebelum tarikh bayaran bulanan.</p><button onclick="appr()">Jalankan sekarang</button></div>`;
  },

  // AFFILIATE
  dash: async () => {
    if (aff.status !== 'ACTIVE') return `<div class="card">Status akaun: ${st(aff.status)}<p>${aff.status === 'PENDING_APPROVAL' ? 'Akaun anda sedang menunggu kelulusan admin.' : 'Sila hubungi admin.'}</p></div>`;
    const { data: c } = await db.from('commissions').select('amount,status');
    return `<div class="grid">${card('Kod anda', e(aff.code))}${card('Klik', aff.clicks)}${card('Tier', e(aff.tier))}${card('Menunggu holding', rm(sum(c, 'PENDING')))}${card('Boleh dimohon', rm(sum(c, 'APPROVED')))}${card('Telah dibayar', rm(sum(c, 'PAID')))}</div>
      <div class="card"><b>Pautan affiliate anda</b><input id="lnk" readonly value="${e(STORE_URL + '?ref=' + aff.code)}"><button onclick="navigator.clipboard.writeText($('lnk').value);alert('Pautan disalin')">Salin pautan</button></div>`;
  },
  com: async () => {
    const { data: c } = await db.from('commissions').select('*').order('created_at', { ascending: false });
    const { data: p } = await db.from('payouts').select('*').order('requested_at', { ascending: false });
    return `<div class="card">Baki boleh dimohon: <b>${rm(sum(c, 'APPROVED'))}</b> <button onclick="reqPay()">Mohon Payout</button></div><h3>Komisen</h3>` +
      table(['Order','Asas jualan','Komisen','Status'], c.map(x => [e(x.order_no), rm(x.base_amount), rm(x.amount), st(x.status)])) +
      '<h3>Payout</h3>' + table(['Tarikh','Jumlah','Status','Rujukan'], p.map(x => [new Date(x.requested_at).toLocaleDateString('ms-MY'), rm(x.amount), st(x.status), e(x.reference || '')]));
  },
  prof: async () => `<div class="card"><b>Maklumat akaun bank (untuk bayaran komisen)</b>
    <input id="pf_t" placeholder="No. telefon" value="${e(aff.phone || '')}">
    <input id="pf_b" placeholder="Nama bank" value="${e(aff.bank_name || '')}">
    <input id="pf_a" placeholder="No. akaun" value="${e(aff.bank_account || '')}">
    <input id="pf_h" placeholder="Nama pemegang akaun" value="${e(aff.bank_holder || '')}">
    <button onclick="saveProf()">Simpan</button></div>`
};

// ---------- TINDAKAN ----------
const setAff = (id, s) => run(db.from('affiliates').update({ status: s }).eq('id', id));
const addProd = () => run(db.from('products').insert({ name: $('np_n').value.trim(), type: $('np_t').value, price: Number($('np_p').value) }));
const saveProd = id => run(db.from('products').update({ price: Number($('pp_' + id).value), commission_type: $('pt_' + id).value, commission_value: Number($('pv_' + id).value), active: $('pa_' + id).checked }).eq('id', id), 'Disimpan');
const ORD_GROUPS = {
  PAID: ['Perlu diproses', o => o.status === 'PAID'], SHIPPED: ['Dihantar', o => o.status === 'SHIPPED'],
  COMPLETED: ['Selesai', o => o.status === 'COMPLETED'], PENDING: ['Belum bayar', o => o.status === 'PENDING_PAYMENT'],
  OTHER: ['Batal/Refund', o => ['CANCELLED', 'REFUNDED'].includes(o.status)], ALL: ['Semua', () => true]
};
const waNo = t => { const d = String(t || '').replace(/\D/g, ''); return d.startsWith('0') ? '6' + d : d.startsWith('60') ? d : '60' + d; };
const renderOrdList = () => { $('ordlist').innerHTML = ordListHtml(); };
function ordListHtml() {
  const q = ordQ.trim().toLowerCase();
  ordList = ordCache.filter(ORD_GROUPS[ordFilter][1]).filter(o => !q || [o.order_no, o.customer_name, o.customer_phone, o.customer_email].join(' ').toLowerCase().includes(q));
  if (!ordList.length) return '<div class="card">Tiada order dalam senarai ini.</div>';
  const why = { self_referral: ' <small>(self-referral disekat)</small>', not_found: ' <small>(kod tidak sah)</small>', inactive: ' <small>(affiliate tidak aktif)</small>' };
  return ordList.map(o => {
    const items = (o.order_items || []).map(i => `${i.qty} × ${e(i.product_name)}`).join('<br>') || '-';
    const ship = o.shipping_fee > 0 ? ` <small>(termasuk pos ${rm(o.shipping_fee)})</small>` : '';
    const nxt = o.status === 'PAID' ? (o.shipping_address ? ['SHIPPED', 'Tanda Dihantar'] : ['COMPLETED', 'Tanda Selesai']) : o.status === 'SHIPPED' ? ['COMPLETED', 'Tanda Selesai'] : null;
    return `<div class="card ord">
      <div class="oh"><b>${e(o.order_no)}</b>${st(o.status)}<small>${new Date(o.created_at).toLocaleString('ms-MY', { dateStyle: 'medium', timeStyle: 'short' })}</small><span style="margin-left:auto"><b style="display:inline">${rm(o.total)}</b>${ship}</span></div>
      <div class="og">
        <div><small>PELANGGAN</small><b>${e(o.customer_name)}</b><a href="https://wa.me/${waNo(o.customer_phone)}" target="_blank" rel="noopener">${e(o.customer_phone)} (WhatsApp)</a><a href="mailto:${e(o.customer_email)}">${e(o.customer_email)}</a></div>
        <div><small>BARANG DIBELI</small>${items}</div>
        <div><small>ALAMAT PENGHANTARAN</small>${o.shipping_address ? e(o.shipping_address).replace(/\n/g, '<br>') + `<br><button class="gr" onclick="copyOrder('${o.id}')">Salin untuk J&amp;T</button>` : '<span class="nt">Tiada penghantaran (webinar/event)</span>'}</div>
      </div>
      <div class="fr oa"><span>Affiliate: <b style="display:inline">${o.affiliates?.code ? e(o.affiliates.code) : '-' + (why[o.ref_status] || '')}</b></span>
        <select onchange="run(db.rpc('set_order_status',{p_order:'${o.id}',p_status:this.value}))">${ORDER_STATUS.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
        ${o.shipping_address ? `<input placeholder="No. tracking J&amp;T" value="${e(o.tracking_no || '')}" onchange="run(db.from('orders').update({tracking_no:this.value}).eq('id','${o.id}'))">` : ''}
        ${nxt ? `<button onclick="run(db.rpc('set_order_status',{p_order:'${o.id}',p_status:'${nxt[0]}'}))">${nxt[1]}</button>` : ''}</div></div>`;
  }).join('');
}
function copyOrder(id) {
  const o = ordCache.find(x => x.id === id);
  navigator.clipboard.writeText(`${o.customer_name}\n${o.customer_phone}\n${o.shipping_address}`).then(() => alert('Nama, telefon dan alamat disalin'));
}
function exportOrders() {
  const q = v => { let s = String(v ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = [['No Order', 'Tarikh', 'Status', 'Nama', 'Telefon', 'Emel', 'Alamat', 'Barang', 'Jumlah', 'Tracking']].concat(ordList.map(o => [o.order_no, new Date(o.created_at).toLocaleString('ms-MY'), o.status, o.customer_name, o.customer_phone, o.customer_email, o.shipping_address, (o.order_items || []).map(i => i.qty + 'x ' + i.product_name).join('; '), o.total, o.tracking_no]));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv' }));
  a.download = 'orders.csv'; a.click();
}
async function delProd(id) {
  const p = prodCache.find(x => x.id === id);
  if (!confirm(`Padam produk "${p ? p.name : ''}" secara kekal?`)) return;
  const { error } = await db.from('products').delete().eq('id', id);
  if (!error) { alert('Produk dipadam'); return render(); }
  if (error.code === '23503') {
    if (confirm('Produk ini ada dalam rekod order, jadi tak boleh dipadam kekal (rekod jualan mesti dikekalkan).\n\nNyahaktifkan sahaja supaya hilang dari kedai?'))
      run(db.from('products').update({ active: false }).eq('id', id), 'Produk dinyahaktifkan dan tidak lagi dipaparkan di kedai');
  } else alert(error.message);
}
const saveInfo = id => run(db.from('products').update({ description: $('pd_' + id).value, info: $('pi_' + id).value, image_url: $('pg_' + id).value.trim() || null }).eq('id', id), 'Butiran disimpan');
const saveSet = k => run(db.from('settings').update({ value: $('s_' + k).value }).eq('key', k), 'Disimpan');
const appr = async () => { const { data, error } = await db.rpc('approve_due_commissions'); alert(error ? error.message : data + ' komisen diluluskan'); };
const payDone = id => { const r = prompt('No. rujukan pindahan bank:'); if (r !== null) run(db.rpc('mark_payout_paid', { p_id: id, p_ref: r }), 'Ditanda dibayar'); };
const payRej = id => { if (confirm('Tolak payout ini? Komisen akan kembali ke baki affiliate.')) run(db.rpc('reject_payout', { p_id: id })); };
const reqPay = () => run(db.rpc('request_payout'), 'Permohonan payout dihantar');
const saveProf = () => run(db.from('affiliates').update({ phone: $('pf_t').value, bank_name: $('pf_b').value, bank_account: $('pf_a').value, bank_holder: $('pf_h').value }).eq('user_id', me.id), 'Disimpan');

boot();
</script>
</body>
</html>
